name: CI

# Finance is not buildable on its own: it is a Bilimbi Domain that mounts at
# apps/domains/finance inside a Bilimbi checkout. This workflow checks out
# Bilimbi at the revision pinned in .github/bilimbi-revision, mounts this
# repository there, and runs Bilimbi's own gates over the composed workspace.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ERL_COMPILER_OPTIONS: deterministic
  MIX_ENV: test

jobs:
  mounted:
    name: Mounted in Bilimbi
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    env:
      PGHOST: localhost
      PGPASSWORD: bilimbi_dev_ca658ad7d8b5
      PGPORT: "5432"
      PGUSER: bilimbi

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: bilimbi_dev_ca658ad7d8b5
          POSTGRES_USER: bilimbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilimbi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: bilimbi

    steps:
      - name: Check out Finance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: finance

      - name: Verify migration versions are unique across modules
        working-directory: finance
        run: .github/scripts/unique_migration_versions.sh

      - name: Read the pinned Bilimbi revision
        id: pin
        working-directory: .
        run: echo "revision=$(tr -d '[:space:]' < finance/.github/bilimbi-revision)" >> "$GITHUB_OUTPUT"

      - name: Check out Bilimbi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BelimbingApp/bilimbi
          ref: ${{ steps.pin.outputs.revision }}
          path: bilimbi

      # The mount folder is the container ID. Moving the checkout keeps its
      # .git, so Finance stays an independent nested repository that Bilimbi's
      # .gitignore ignores.
      - name: Mount Finance at apps/domains/finance
        working-directory: .
        run: mv finance bilimbi/apps/domains/finance

      # Bilimbi's .mise.toml is the toolchain pin for that revision.
      - name: Read Bilimbi's toolchain
        id: tools
        run: |
          echo "otp=$(sed -n 's/^erlang = "\(.*\)"$/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
          echo "elixir=$(sed -n 's/^elixir = "\([^-"]*\).*"$/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ steps.tools.outputs.otp }}
          elixir-version: ${{ steps.tools.outputs.elixir }}
          version-type: strict

      # Only fetched dependencies are cached. The build tree is rebuilt every
      # run: a `_build` saved after `mix precommit` can list test-support
      # modules in an application's .app without their .beam.
      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bilimbi/deps
          key: ${{ runner.os }}-deps-mounted-${{ steps.pin.outputs.revision }}-${{ hashFiles('bilimbi/apps/domains/finance/**/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-deps-mounted-${{ steps.pin.outputs.revision }}-

      # With a repository mounted and BILIMBI_COMPOSITION_PINNED unset, the first
      # project load derives .scratchpad/composition-lock/mix.lock from the
      # Platform lock, and `mix deps.get` resolves Finance's dependencies into
      # that overlay (docs/architecture/0010_composition-model.md).
      - name: Derive the composition lock
        run: mix deps.get

      # Pin the derived overlay to the exact Platform and Finance revisions,
      # then load it the way pinned CI does: dependency resolution must not
      # change a pinned lock.
      - name: Verify the composition lock as pinned
        run: |
          mix bilimbi.composition.lock --pin
          cat .scratchpad/composition-lock/manifest.txt
          BILIMBI_COMPOSITION_PINNED=1 mix deps.get --check-locked
          BILIMBI_COMPOSITION_PINNED=1 mix deps.loadpaths

      - name: Compile each module strictly
        run: mix compile.strict

      - name: Verify declared module-graph edges
        run: elixir .github/scripts/graph_edges.exs

      - name: Enforce greppable AGENTS.md mandates
        run: .github/scripts/mandates.sh

      # The mounted Tailwind source test builds CSS with the pinned binary.
      - name: Install Tailwind
        run: (cd apps/web && mix tailwind.install --if-missing)

      # The module hooks test bundles mounted hooks with the pinned esbuild binary.
      - name: Install esbuild
        run: (cd apps/web && mix esbuild.install --if-missing)

      # `mix precommit` runs the LiveView hook tests in Node (`mix assets.test`).
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run Bilimbi's precommit with Finance mounted
        run: mix precommit

      # Precommit formats and unlocks unused dependencies in place. Neither
      # repository nor the pinned composition lock may change.
      - name: Verify precommit made no changes
        run: |
          git diff --exit-code
          git -C apps/domains/finance diff --exit-code
          mix bilimbi.composition.lock --check

      # Runs last: it moves Finance out of the mounted workspace and back, and
      # mounts a throwaway Extension that the steps above must never see.
      - name: Verify a missing Finance dependency fails composition
        run: apps/domains/finance/.github/scripts/missing_dependency.sh
